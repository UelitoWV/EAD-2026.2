  <div><button class="btn" id="go" type="button">Começar o plantão</button></div>
  <h3 style="margin-top:1.5rem">Pódio global (todos os jogadores)</h3><div id="gp" aria-live="polite"><p class="note">Carregando pódio global…</p></div>
  <h3>Seus melhores resultados neste aparelho</h3>${podHtml(pod,-1)}
  <p class="note">Casos fictícios, para fins didáticos. Apelidos do pódio global são públicos: não use seu nome real.</p>`;
  rk("GET").then(t=>{const e=document.getElementById("gp");if(e)e.innerHTML=gHtml(t)});
  document.getElementById("go").onclick=()=>{const n=esc(document.getElementById("nick").value.trim())||"Anônimo(a)";sv("dc_nick",n);start(n,document.getElementById("pub").checked)};
}
function podHtml(p,hl){return p.length?`<ol class="pod">${p.map((r,k)=>`<li${k===hl?' class="me"':""}>${esc(r.n)}: ${r.s} pts (${lvl(r.s)})</li>`).join("")}</ol>`:`<p class="note">Ainda sem resultados. Seja o(a) primeiro(a)!</p>`}

function start(n,pub){
  const q=POOL.map(c=>[Math.random(),c]).sort((a,b)=>a[0]-b[0]).slice(0,N).map(x=>x[1]);
  S={n,pub,q,i:0,sc:0,hp:3,cb:1,got:new Set(),key:true,ok:0};caso();foc();
}
function hud(){return `<div class="hud"><div class="st">Caso<b>${S.i+1}/${N}</b></div><div class="st">Reputação<b aria-label="Reputação: ${S.hp} de 3">${"♥".repeat(S.hp)}${"♡".repeat(3-S.hp)}</b></div><div class="st">Combo<b>x${S.cb}</b></div><div class="st">Pontos<b>${S.sc}</b></div><div class="st">Nível<b style="font-size:1rem">${lvl(S.sc)}</b></div></div>`}

function caso(){
  const c=S.q[S.i];S.u=[];S.m=BUD;S.dn=false;
  g.innerHTML=`${hud()}<h2 id="h" tabindex="-1">${c.t}</h2>
  <div class="chat"><small>${c.d}</small><div class="bub">${c.img?`<img class="pic" src="${c.img}" alt="${c.alt||""}" loading="lazy" onerror="this.remove()">`:""}${c.m}</div></div>
  <div class="clock" style="margin:1rem 0 .6rem"><span id="mt">Fichas de investigação: ${BUD} de ${BUD}</span><span id="tk" class="tk" aria-hidden="true">${fch(BUD)}</span><br><span class="note" style="font-weight:400">Sem cronômetro: o jogo só avança quando você age.</span></div>
  <div class="grid">${[...LBL,c.x].map((l,k)=>`<button class="btn alt act" type="button" data-k="${k}">${l}<small>${COST[k]} ${COST[k]>1?"fichas":"ficha"}</small></button>`).join("")}</div>
  <ul id="log" aria-label="Pistas encontradas"></ul>
  <h3>Carimbe sua decisão</h3>
  <div class="dec">${Object.entries(DEC).map(([k,v])=>`<button class="btn stamp dbtn" type="button" data-d="${k}" disabled>${v}</button>`).join("")}</div>
  <p class="note" id="hint">Faça ao menos uma investigação para liberar o carimbo.</p><div id="fb" tabindex="-1"></div>`;
  g.querySelectorAll(".act").forEach(b=>b.onclick=()=>act(+b.dataset.k,b));
  g.querySelectorAll(".dbtn").forEach(b=>b.onclick=()=>decide(b.dataset.d));
  sync();
}
function sync(){g.querySelectorAll(".act").forEach(b=>{const k=+b.dataset.k;b.disabled=S.dn||S.u.includes(k)||COST[k]>S.m})}
function act(k){
  if(S.dn||S.u.includes(k)||COST[k]>S.m)return;
  S.u.push(k);S.m-=COST[k];const c=S.q[S.i],a=c.a[k];
  const li=document.createElement("li");li.className="t-"+a[1];
  li.innerHTML=`<span class="tag">${TAG[a[1]]}</span><b>${[...LBL,c.x][k]}</b><p>${a[0]}</p>`;
  document.getElementById("log").appendChild(li);
  document.getElementById("mt").textContent="Fichas de investigação: "+S.m+" de "+BUD;document.getElementById("tk").textContent=fch(S.m);
  g.querySelectorAll(".dbtn").forEach(b=>b.disabled=false);document.getElementById("hint").textContent="";
  live(`${TAG[a[1]]}: ${a[0]} Restam ${S.m} fichas.`);sync();
}
function decide(d){
  if(S.dn)return;S.dn=true;const c=S.q[S.i];let pts=0,cls="bad",head="Erro de julgamento.";
  const had=c.a.some(a=>a[1]==="c"),found=S.u.some(k=>c.a[k][1]==="c");
  if(had&&!found)S.key=false;
  const old=lvl(S.sc);
  if(d===c.ok){pts=(100+15*S.m)*S.cb;cls="ok";head="Decisão certeira!";S.ok++;if(S.cb===3)S.got.add("Combo triplo");S.cb=Math.min(3,S.cb+1);if(c.ok==="sim")S.got.add("Anti-paranoia");if(c.ok==="mais")S.got.add("Cético com método")}
  else if(d===c.p){pts=40;cls="mid";head="Decisão parcialmente adequada.";S.cb=1}
  else{S.hp--;S.cb=1}
  S.sc+=pts;g.querySelectorAll(".act,.dbtn").forEach(b=>b.disabled=true);
  const miss=c.a.map((a,k)=>[a,k]).filter(([a,k])=>a[1]==="c"&&!S.u.includes(k)).map(([a,k])=>[...LBL,c.x][k]);
  const up=lvl(S.sc)!==old?`<p><strong>Subiu de nível: ${lvl(S.sc)}!</strong></p>`:"";
  const fin=S.hp<=0||S.i+1>=N;
  const fb=document.getElementById("fb");fb.className=cls;
  fb.innerHTML=`<p><strong>${head}</strong> “${DEC[d]}”: +${pts} pontos.${S.hp<=0?" Sua reputação acabou.":""}</p>${d!==c.ok?`<p><strong>Mais adequado:</strong> “${DEC[c.ok]}”.</p>`:""}<p>${c.w}</p>${miss.length?`<p><strong>Pista forte que você não buscou:</strong> ${miss.join("; ")}.</p>`:""}${up}<button class="btn" id="nx" type="button">${fin?"Ver resultado":"Próximo caso"}</button>`;
  document.getElementById("nx").onclick=()=>{if(fin)fim();else{S.i++;caso();foc()}};
  fb.focus();
}
function fim(){
  if(S.hp===3&&S.ok===S.q.length)S.got.add("Reputação intacta");if(S.key)S.got.add("Olho clínico");
  const all=ld("dc_bd",[]);S.got.forEach(b=>{if(!all.includes(b))all.push(b)});sv("dc_bd",all);
  const pod=ld("dc_pod",[]);const me={n:S.n,s:S.sc};pod.push(me);pod.sort((a,b)=>b.s-a.s);const pos=pod.indexOf(me);pod.splice(5);sv("dc_pod",pod);
  g.innerHTML=`<h2 id="h" tabindex="-1">${S.hp>0?"Plantão encerrado":"Fim de jogo: reputação esgotada"}</h2>
  <p class="big">${S.sc} pontos</p><p><strong>Nível: ${lvl(S.sc)}</strong> · ${S.ok} de ${S.q.length} decisões certeiras</p>
  <h3>Conquistas</h3><ul class="badges">${BD.map(b=>`<li class="${S.got.has(b)?"":"off"}">${b}${S.got.has(b)?" (nesta partida)":all.includes(b)?" (já conquistada)":" (bloqueada)"}: ${BDD[b]}</li>`).join("")}</ul>
  <h3>Pódio global (todos os jogadores)</h3><div id="gp" aria-live="polite"><p class="note">${S.pub&&S.sc>0?"Enviando sua pontuação…":"Carregando…"}</p></div>
  <h3>Neste aparelho</h3>${pos>=0&&pos<5?`<p>Você ficou em <strong>${pos+1}º lugar</strong>.</p>`:`<p>Você não entrou no top 5 desta vez.</p>`}${podHtml(pod,pos)}
  <button class="btn" id="again" type="button">Jogar de novo</button>
  <a class="btn alt" href="index.html#modulo-1">Rever os módulos</a>
  <a class="btn alt" href="index.html#avaliacao">Ir para a avaliação</a>`;
  document.getElementById("again").onclick=()=>{intro();foc()};foc();
  const gm={n:S.n.replace(/[^\p{L}\p{N} ._-]/gu,"").trim().slice(0,16)||"Anônimo(a)",s:S.sc};
  (S.pub&&S.sc>0?rk("POST",{n:S.n,s:S.sc}):rk("GET")).then(t=>{const e=document.getElementById("gp");if(e)e.innerHTML=(S.pub&&S.sc>0?"":'<p class="note">Sua pontuação não foi enviada ao pódio global.</p>')+gHtml(t,S.pub?gm:null)});
}
intro();
</script>
</body>
</html>
